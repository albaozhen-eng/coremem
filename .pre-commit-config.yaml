repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: detect-private-key
        name: detect-private-key
      - id: check-yaml
      - id: end-of-file-fixer
      - id: trailing-whitespace

  - repo: local
    hooks:
      - id: secret-scan
        name: secret-scan
        entry: python3 scripts/secret_scan.py
        language: system
        types: [text]
        pass_filenames: false